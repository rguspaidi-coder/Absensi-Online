    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, getDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // PENGATURAN FIREBASE - Masukkan API Key Anda di sini
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyA5yK61rjWwa0QRgde1jgyuBSbEe0wlH9o",
            authDomain: "absensi-online-fcae9.firebaseapp.com",
            projectId: "absensi-online-fcae9",
            storageBucket: "absensi-online-fcae9.firebasestorage.app",
            messagingSenderId: "240804059160",
            appId: "1:240804059160:web:86a0ef363810be7ed24b6d",
            measurementId: "G-KR2QZJMDZD"
      };

        const appId = 'sman1bab_absensi'; // ID Unik untuk sekolah ini
        // =========================================================================

        let app, db, auth;
        let userId = null;
        let chartInstance = null;

        // Global State
        const state = {
            settings: { gateLimit: '07:30' },
            students: [],
            classes: [],
            attendanceData: {}, 
            currentView: 'dashboard'
        };

        // --- Utilities ---
        function getTodayDateString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function getCurrentTimeString() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // Live Clock
        setInterval(() => {
            const now = new Date();
            const timeEl = document.getElementById('live-time');
            const dateEl = document.getElementById('live-date');
            
            if(timeEl) timeEl.textContent = now.toLocaleTimeString('id-ID');
            if(dateEl) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateEl.textContent = now.toLocaleDateString('id-ID', options);
            }
        }, 1000);

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let style = '', icon = '';
            if (type === 'success') {
                style = 'bg-white border-l-4 border-green-500 text-slate-800';
                icon = '<i class="ph-fill ph-check-circle text-green-500 text-xl"></i>';
            } else if (type === 'error') {
                style = 'bg-white border-l-4 border-red-500 text-slate-800';
                icon = '<i class="ph-fill ph-warning-circle text-red-500 text-xl"></i>';
            } else {
                style = 'bg-brand-900 text-white shadow-xl';
                icon = '<i class="ph-fill ph-info text-gold-400 text-xl"></i>';
            }
            
            toast.className = `p-4 rounded-xl shadow-lg flex items-center gap-3 w-72 slide-in-right pointer-events-auto ${style}`;
            toast.innerHTML = `${icon}<span class="font-medium text-sm">${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Initialization ---
        async function initApp() {
            try {
                if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "AIzaSyBxxxxxxx-xxxxxxxxxxxxxxx") {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    await signInAnonymously(auth);
                    userId = auth.currentUser.uid;
                    await loadDataFromFirebase();
                } else {
                    console.warn("Menggunakan Mode Offline/Demo. Harap isi API Key Firebase.");
                    mockLoadData(); // Load dummy data for preview
                }
            } catch (error) {
                console.error("Init Error:", error);
                window.showToast("Menggunakan Mode Offline", "info");
                mockLoadData();
            }

            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 300);
            window.navigate('dashboard');
        }

        async function loadDataFromFirebase() {
            try {
                const [studentsSnap, classesSnap, attSnap] = await Promise.all([
                    getDocs(collection(db, `${appId}_students`)),
                    getDocs(collection(db, `${appId}_classes`)),
                    getDocs(collection(db, `${appId}_attendance_${getTodayDateString()}`))
                ]);

                state.students = studentsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                state.classes = classesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                const today = getTodayDateString();
                state.attendanceData[today] = {};
                attSnap.docs.forEach(doc => { state.attendanceData[today][doc.id] = doc.data(); });
                
                // Sort by name
                state.students.sort((a, b) => a.name.localeCompare(b.name));
                state.classes.sort((a, b) => a.name.localeCompare(b.name));
            } catch (error) {
                console.error("Firebase Load Error:", error);
                window.showToast("Gagal memuat data dari server", "error");
            }
        }

        function mockLoadData() {
            state.classes = [{id: 'c1', name: 'X IPA 1'}, {id: 'c2', name: 'X IPS 1'}, {id: 'c3', name: 'XI IPA 1'}];
            state.students = [
                {id: 's1', name: 'Aditya Pratama', nis: '1001', className: 'X IPA 1'},
                {id: 's2', name: 'Bunga Lestari', nis: '1002', className: 'X IPA 1'},
                {id: 's3', name: 'Citra Kirana', nis: '1003', className: 'X IPS 1'},
                {id: 's4', name: 'Dimas Anggara', nis: '1004', className: 'XI IPA 1'}
            ];
            state.attendanceData[getTodayDateString()] = {};
        }

        async function saveAttendanceToFirebase(studentId, date, data) {
            const todayData = state.attendanceData[date] || {};
            const existingData = todayData[studentId] || {};
            const newData = { ...existingData, ...data, studentId, date, updatedAt: new Date().toISOString() };
            
            state.attendanceData[date] = state.attendanceData[date] || {};
            state.attendanceData[date][studentId] = newData;

            if (db) {
                try {
                    await setDoc(doc(db, `${appId}_attendance_${date}`, studentId), newData);
                } catch (error) {
                    console.error("Save Error:", error);
                    window.showToast("Gagal menyimpan ke cloud", "error");
                }
            }
        }

        // --- Navigation Logic ---
        window.navigate = function(view) {
            state.currentView = view;
            
            // Update Active Styling
            const isMobile = window.innerWidth < 768;
            ['dashboard', 'absensi', 'master', 'rekap'].forEach(v => {
                const el = document.getElementById(`nav-${v}`);
                if(el) {
                    el.classList.remove('nav-active', 'nav-active-mobile');
                    if(v === view) {
                        isMobile ? el.classList.add('nav-active-mobile') : el.classList.add('nav-active');
                    }
                }
            });

            const titles = {
                'dashboard': 'Dashboard Analitik',
                'absensi': 'Panel Absensi Terpadu',
                'master': 'Pusat Data Master',
                'rekap': 'Rekapitulasi Data'
            };
            document.getElementById('page-title').textContent = titles[view] || '';

            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'fade-in';
            
            if (view === 'dashboard') renderDashboard(wrapper);
            else if (view === 'absensi') renderUnifiedAbsensi(wrapper);
            else if (view === 'master') renderDataMaster(wrapper);
            else if (view === 'rekap') renderRekap(wrapper);
            
            contentArea.appendChild(wrapper);
        }

        // --- Views Rendering ---
        function renderDashboard(container) {
            const today = getTodayDateString();
            const todayAtt = state.attendanceData[today] || {};
            const totalSiswa = state.students.length;
            
            let stats = { hadir: 0, terlambat: 0, alfa: 0, izin: 0, sakit: 0 };
            let bermasalah = [];
            
            state.students.forEach(s => {
                const att = todayAtt[s.id];
                if (!att) return;
                
                let isHadir = att.morning_status === 'H' || att.afternoon_status === 'H';
                if (isHadir) stats.hadir++;
                if (att.gate_status === 'Terlambat') stats.terlambat++;
                if (att.morning_status === 'A' && att.afternoon_status === 'A') stats.alfa++;
                if (att.morning_status === 'I') stats.izin++;
                if (att.morning_status === 'S') stats.sakit++;

                // Logika Absen Bermasalah
                if (att.gate_status === 'Terlambat' && att.morning_status === 'A') {
                    bermasalah.push({ name: s.name, class: s.className, issue: 'Masuk Gerbang Terlambat, namun Alfa di kelas' });
                }
                if (att.morning_status === 'A' && att.afternoon_status === 'H') {
                    bermasalah.push({ name: s.name, class: s.className, issue: 'Alfa Pagi, tapi Hadir Siang (Indikasi terlambat parah)' });
                }
            });

            container.innerHTML = `
                <!-- School Banner Premium -->
                <div class="bg-brand-900 rounded-3xl p-6 md:p-8 text-white mb-8 shadow-xl relative overflow-hidden flex flex-col md:flex-row justify-between md:items-center">
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-brand-500 rounded-full opacity-20 blur-3xl"></div>
                    <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-gold-500 rounded-full opacity-10 blur-2xl"></div>
                    
                    <div class="relative z-10">
                        <div class="inline-block px-3 py-1 bg-white/10 backdrop-blur-sm rounded-full text-xs font-medium text-gold-400 mb-3 border border-white/10">
                            Tahun Pelajaran 2026/2027
                        </div>
                        <h2 class="text-2xl md:text-4xl font-display font-bold mb-2 tracking-tight">SMA Negeri 1 Basa Ampek Balai</h2>
                        <p class="text-brand-100 text-sm md:text-base max-w-2xl flex items-start opacity-90">
                            <i class="ph ph-map-pin mt-1 mr-2 text-gold-400"></i>
                            Jln. Alang Rambah, Nagari Koto Enau, Kecamatan Basa Ampek Balai, Kab. Pesisir Selatan
                        </p>
                    </div>
                    
                    <div class="relative z-10 mt-6 md:mt-0 text-right hidden md:block">
                        <div class="w-24 h-24 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 shadow-lg">
                            <i class="ph-fill ph-buildings text-5xl text-gold-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Stat Cards -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-8">
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group hover:-translate-y-1 transition-transform">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-blue-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="relative z-10 flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-slate-500 mb-1">Total Siswa</p>
                                <h3 class="text-3xl font-bold text-slate-800">${totalSiswa}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-xl">
                                <i class="ph-fill ph-users"></i>
                            </div>
                        </div>
                    </div>
                    
                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group hover:-translate-y-1 transition-transform">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-green-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="relative z-10 flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-slate-500 mb-1">Hadir (Hari Ini)</p>
                                <h3 class="text-3xl font-bold text-green-600">${stats.hadir}</h3>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-green-100 text-green-600 flex items-center justify-center text-xl">
                                <i class="ph-fill ph-check-circle"></i>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card p-5 rounded-2xl relative overflow-hidden group hover:-translate-y-1 transition-transform">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-amber-50 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="relative z-10 flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-slate-500 mb-1">Terlambat</p>
                                <h3 class="text-3xl font-bold text-amber-600">${stats.terlambat}</h3>

            const studentsInClass = state.students.filter(s => s.className === cls);

            document.getElementById('loading-screen').style.display = 'flex';
            document.getElementById('loading-screen').style.opacity = '1';

            for(const s of studentsInClass) {
                await saveAttendanceToFirebase(s.id, today, { [key]: status });

            if(!confirm("Semua kolom absensi yang kosong (Gerbang, Pagi, Siang) pada hari ini akan diotomatiskan menjadi HADIR. Lanjutkan?")) return;
            
            const today = getTodayDateString();
            const time = getCurrentTimeString();
            let count = 0;

            document.getElementById('loading-screen').style.display = 'flex';
            document.getElementById('loading-screen').style.opacity = '1';

            for (const s of state.students) {
                const att = (state.attendanceData[today] || {})[s.id] || {};
                let update = {};
                if (!att.gate_status) { update.gate_status = 'Hadir'; update.gate_time = time; }
                if (!att.morning_status || att.morning_status === '-') update.morning_status = 'H';
                if (!att.afternoon_status || att.afternoon_status === '-') update.afternoon_status = 'H';
                
                if (Object.keys(update).length > 0) {
                    await saveAttendanceToFirebase(s.id, today, update);
                    count++;
                }
            }
            window.showToast(`${count} aksi auto-hadir berhasil dijalankan!`);
            initApp();
        }

        window.downloadTemplateExcel = function() {
            const wb = XLSX.utils.book_new();
            const wsData = [
                ["NIS", "Nama", "Kelas"],
                ["1001", "Aditya Pratama", "X IPA 1"],
                ["1002", "Bunga Lestari", "X IPA 1"],
                ["1003", "Citra Kirana", "XI IPS 2"]
            ];
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            
            // Auto size columns slightly
            ws['!cols'] = [{wch:10}, {wch:25}, {wch:12}];
            
            XLSX.utils.book_append_sheet(wb, ws, "DataSiswa");
            XLSX.writeFile(wb, "Template_Import_Siswa_SMAN1BAB.xlsx");
            window.showToast("Template Excel berhasil diunduh");
        }

        window.handleExcelUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                const headers = json[0].map(h => String(h).toLowerCase().trim());
                const nisIdx = headers.indexOf('nis');
                const nameIdx = headers.indexOf('nama');
                const classIdx = headers.indexOf('kelas');

                if (nisIdx === -1 || nameIdx === -1 || classIdx === -1) {
                    window.showToast("Format Excel salah. Wajib ada kolom NIS, Nama, Kelas.", "error");
                    return;
                }

                let importedStudents = [];
                let importedClasses = new Set();

                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (!row || !row[nameIdx]) continue;
                    
                    const nis = String(row[nisIdx] || `N-${Math.floor(Math.random()*10000)}`).trim();
                    const name = String(row[nameIdx]).trim();
                    const className = String(row[classIdx] || 'Belum Ada Kelas').trim();

                    importedClasses.add(className);
                    importedStudents.push({
                        id: `s_${Date.now()}_${i}`,
                        nis: nis,
                        name: name,
                        className: className
                    });
                }

                if(confirm(`Memproses ${importedStudents.length} siswa dan ${importedClasses.size} kelas dari file Excel. Lanjutkan sinkronisasi?`)) {
                    document.getElementById('loading-screen').style.display = 'flex';
                    document.getElementById('loading-screen').style.opacity = '1';
                    
                    try {
                        if (db) {
                            const batch = writeBatch(db);
                            const classArr = Array.from(importedClasses);
                            const classMap = {}; 
                            classArr.forEach((cName, idx) => {
                                const cId = `c_${Date.now()}_${idx}`;
                                classMap[cName] = cId;
                                const docRef = doc(db, `${appId}_classes`, cId);
                                batch.set(docRef, { name: cName });
                            });

                            importedStudents.forEach(s => {
                                s.classId = classMap[s.className];
                                const docRef = doc(db, `${appId}_students`, s.id);
                                batch.set(docRef, s);
                            });

                            await batch.commit();
                            await loadDataFromFirebase();
                        } else {
                            state.classes = Array.from(importedClasses).map((c, i) => ({id: `c_${i}`, name: c}));
                            state.students = importedStudents;
                        }

                        window.showToast("Import data berhasil disimpan ke sistem!");
                        window.navigate('master');
                    } catch (error) {
                        console.error(error);
                        window.showToast("Gagal mengimpor ke database", "error");
                    }
                    
                    document.getElementById('loading-screen').style.opacity = '0';
                    setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 300);
                }
                event.target.value = ''; 
            };
            reader.readAsArrayBuffer(file);
        }
